name: Publish container

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

# 같은 branch 에 연달아 push 하면 앞의 run 을 취소한다. 태그 하나가 branch 이름이라,
# 두 run 이 겹치면 나중에 시작한 쪽이 먼저 끝나 오래된 commit 이 그 태그를 차지할 수 있다.
concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: project-artel/agent

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그 둘을 만든다. branch 이름은 그 branch 의 최신 것을 가리키며 움직이고,
      # 40자리 commit sha 는 한 빌드에 고정된다. type=sha 의 기본값은 짧은 sha 에
      # `sha-` 를 붙이므로, prefix 를 비우고 format 을 long 으로 바꾼다.
      - name: Resolve tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=

      # `Dockerfile` 의 runtime stage 는 `GIT_SHA` 와 `IMAGE_TAG` 를 ENV 로 굽는다. QA 런이
      # 기록한 이미지를 다시 띄워 과거 agent 구조를 재현하기 위해서다. `IMAGE_TAG` 에 branch
      # 태그를 쓰면 다음 push 가 같은 태그를 다른 이미지로 옮겨 버려, 그 태그로 기록된 런이
      # 더 이상 재현되지 않는다. 그래서 여기는 반드시 40자리 commit sha 로 고정한 전체
      # 참조를 쓴다. `target: runtime` 을 지정해, `test` stage 의 `pytest` 가 이 빌드에서
      # 돌지 않게 한다 — 테스트는 Jenkins 가 맡는다.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

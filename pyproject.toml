[project]
name = "artel-agent-server"
version = "0.1.0"
description = "AI agent operation server backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

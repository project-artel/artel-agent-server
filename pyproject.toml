[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "artel-agent-server"
version = "0.1.0"
description = "AI agent operation server backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.27.0",
    # Upper bound because `app/agents/qa/compaction.py` overrides
    # `SummarizationMiddleware._should_summarize`, which is not API. The floor is
    # the version that seam exists in; `tests/test_qa_compaction.py` fails loudly
    # if a later one moves it, which is the point — compaction breaking quietly
    # would surface as a provider 400 several turns into a run.
    "langchain>=1.3.14,<2",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pdfplumber>=0.11.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# Prompt bodies are data, not code, so the wheel drops them unless they are
# named here. Without them the app refuses to start (validate_prompts).
# 배포되는 것은 애플리케이션뿐이다. 명시하지 않으면 setuptools 가 최상위를
# 훑어 `output/` 같은 산출물 디렉터리를 패키지 후보로 세고, 둘 이상이면
# flat-layout 이라며 빌드를 거부한다 — 로컬에 산출물이 있는 사람만 깨진다.
[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
"app.prompts" = ["**/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Tests are function-style. Collect only classes ending in "Tests" so domain
# types named after the product's "TestCase" vocabulary (TestCaseHit, …) are not
# mistaken for test classes and warned about.
python_classes = ["*Tests"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "artel-agent-server"
version = "0.1.0"
description = "AI agent operation server backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.27.0",
    "langchain>=1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pdfplumber>=0.11.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# Prompt bodies are data, not code, so the wheel drops them unless they are
# named here. Without them the app refuses to start (validate_prompts).
[tool.setuptools.package-data]
"app.prompts" = ["**/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Tests are function-style. Collect only classes ending in "Tests" so domain
# types named after the product's "TestCase" vocabulary (TestCaseHit, …) are not
# mistaken for test classes and warned about.
python_classes = ["*Tests"]
